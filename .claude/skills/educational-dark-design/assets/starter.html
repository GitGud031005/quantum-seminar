<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DECK TITLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;500;600;700&family=Lato:wght@400;700&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   EDUCATIONAL DARK SLIDES — DESIGN SYSTEM v1
   Source: "Choosing a Career for Students" (Slidesgo), slides 1–35 + 45.
   Canvas: 960 × 540 px (16:9) = the PPTX canvas exactly. 1pt = 1.333px.
   DO NOT edit tokens per deck. Only add slide-specific rules at the bottom,
   inside the marked "DECK-SPECIFIC" block, and only using the tokens.
   ========================================================================== */
:root{
  /* ---- Color (the whole palette — nothing else is allowed) ---- */
  --navy:  #0D1030;   /* canvas (every slide), holes in donuts, stripe gaps */
  --cyan:  #79E0FF;   /* titles, item headings, lines, motifs */
  --blue:  #0F5AFF;   /* motifs, chart series, highlight fills */
  --grey:  #C2C2C2;   /* step / section numbers, secondary values */
  --white: #FFFFFF;   /* body text, motifs */

  /* ---- Type ---- */
  --font-display: 'Signika', Arial, sans-serif;               /* titles, headings, numbers */
  --font-body:    'Lato', Arial, sans-serif;                   /* body, captions */
  --fs-xs:   13.33px;  /* 10pt  footnotes, chart axis, month labels */
  --fs-sm:   16px;     /* 12pt  dense body, captions */
  --fs-body: 18.67px;  /* 14pt  body text (default) */
  --fs-lead: 21.33px;  /* 16pt  subtitles under display text */
  --fs-h4:   24px;     /* 18pt  table headers, compact labels */
  --fs-h3:   29.33px;  /* 22pt  item heading */
  --fs-stat: 40px;     /* 30pt  step numbers, percentages, table values */
  --fs-h2:   46.67px;  /* 35pt  slide title */
  --fs-sec:  50.67px;  /* 38pt  section title */
  --fs-d3:   64px;     /* 48pt  statement */
  --fs-cv:   69.33px;  /* 52pt  cover title */
  --fs-d2:   80px;     /* 60pt  section number, "Whoa!", "Cảm ơn!" */
  --fs-d1:   96px;     /* 72pt  big number */
  --lh-tight: 1.05;
  --lh-title: 1.12;
  --lh-body:  1.25;

  /* ---- Grid ---- */
  --W: 960px; --H: 540px;
  --mx: 75px;          /* title box edge */
  --title-top: 47px;
  --u: 88px;           /* motif tile (all decorative clusters are built from it) */
}
/* Lato has no Vietnamese glyphs (ạ, ế, ộ…). Vietnamese decks swap to the closest humanist sans that has them. */
:root:lang(vi){--font-body:'Nunito Sans', Arial, sans-serif}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy)}
body{font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ---------------- Slide canvas ---------------- */
.deck{position:absolute;left:0;top:0;width:var(--W);height:var(--H);transform-origin:0 0}
.slide{position:absolute;inset:0;width:var(--W);height:var(--H);overflow:hidden;background:var(--navy);
  color:var(--white);font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);display:none}
.slide.active{display:block}

/* ---------------- Text primitives ---------------- */
.title{position:absolute;left:var(--mx);top:var(--title-top);width:810px;height:60px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-family:var(--font-display);font-size:var(--fs-h2);font-weight:700;line-height:var(--lh-title);color:var(--cyan);z-index:1}
.h3{font-family:var(--font-display);font-size:var(--fs-h3);font-weight:700;color:var(--cyan);line-height:1.1}
.h4{font-family:var(--font-display);font-size:var(--fs-h4);font-weight:700;color:var(--cyan);line-height:1.1}
.num{font-family:var(--font-display);font-size:var(--fs-stat);font-weight:700;color:var(--grey);line-height:1}
.stat{font-family:var(--font-display);font-size:var(--fs-stat);font-weight:700;color:var(--white);line-height:1}
.sm{font-size:var(--fs-sm)} .xs{font-size:var(--fs-xs)}
.hl{color:var(--white)}               /* highlight a keyword inside cyan display text */
b,strong{font-weight:700;color:var(--cyan)}
.center{text-align:center} .right{text-align:right} .left{text-align:left}
.ul{list-style:none}
.ul li{position:relative;padding-left:1.4em}
.ul li::before{content:"";position:absolute;left:.3em;top:.45em;width:.4em;height:.4em;border-radius:50%;background:var(--cyan)}
.ul li li::before{background:transparent;border:1.5px solid var(--cyan)}
.ul li+li{margin-top:.35em}
.ul ul{list-style:none;margin-top:.25em}
.it .h3,.it .h4{margin-bottom:6px}
.zz{position:absolute;inset:0}       /* item layer: positional layouts count items inside it only */
.it .num{margin-bottom:10px}
.slide > :not(.deco){z-index:1}

/* ---------------- Decorative motifs ----------------
   Exact vector shapes from the PPTX layouts, stored once in the sprite at the top of <body>.
   A slide places them with <svg class="deco" style="left/top/width/height"><use href="#m…"/></svg>,
   copied verbatim from its snippet. Boxes may extend past the canvas; the slide clips them. */
.deco{position:absolute;display:block;overflow:visible;z-index:0;pointer-events:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ---------------- Components ---------------- */
.photo{display:block;width:100%;height:100%;object-fit:cover}              /* warm, natural photos stay in color */
.shot{display:block;width:100%;height:100%;object-fit:cover;background:var(--white)} /* product screenshots */
.ph{width:100%;height:100%;border:2px dashed var(--grey);display:flex;align-items:center;justify-content:center;
  color:var(--grey);font-size:var(--fs-sm);font-weight:700;text-align:center;padding:10px}
.icon{width:40px;height:40px;stroke:var(--cyan);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--cyan);vertical-align:middle}
.dot.blue{background:var(--blue)} .dot.grey{background:var(--grey)} .dot.white{background:var(--white)}
/* SVG paint helpers — never hard-code hex inside SVG, use these */
.s-navy{stroke:var(--navy)} .s-cyan{stroke:var(--cyan)} .s-blue{stroke:var(--blue)} .s-grey{stroke:var(--grey)} .s-white{stroke:var(--white)}
.f-navy{fill:var(--navy)} .f-cyan{fill:var(--cyan)} .f-blue{fill:var(--blue)} .f-grey{fill:var(--grey)} .f-white{fill:var(--white)} .f-none{fill:none}
svg text{font-family:var(--font-body)}
.node{display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 14px;min-height:44px;line-height:1.15;
  border:2px solid var(--cyan);color:var(--white)}
.node.blue{background:var(--blue);border-color:var(--blue);font-weight:700}
.node.cyan{background:var(--cyan);color:var(--navy);font-weight:700}
.tbl{border-collapse:collapse;width:100%}
.tbl th,.tbl td{border:1.5px solid var(--cyan);padding:8px 12px;text-align:center;vertical-align:middle;line-height:1.2}
.tbl th{font-family:var(--font-display);font-size:var(--fs-h4);font-weight:700;color:var(--cyan)}
.tbl td{font-size:var(--fs-sm);color:var(--white)}
.tbl td.v{font-family:var(--font-display);font-size:var(--fs-h3);font-weight:700;color:var(--grey)}
.tbl .rh{font-family:var(--font-display);font-size:var(--fs-h4);font-weight:700;color:var(--cyan)}

/* ===================== LAYOUTS ===================== */
/* Absolute regions below mirror the PPTX placeholder boxes (px). */

/* 01 cover */
.l-cover .cv{position:absolute;left:144px;top:96px;width:672px;height:348px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.l-cover .cv-title{font-family:var(--font-display);font-size:var(--fs-cv);font-weight:700;line-height:var(--lh-tight);color:var(--cyan)}
.l-cover .cv-sub{font-size:var(--fs-lead)}
.l-cover .cv-meta{margin-top:10px;font-size:var(--fs-sm);line-height:1.4;color:var(--grey)}
.l-cover .cv-meta b{color:var(--white)}

/* 02 toc */
.l-toc .toc{position:absolute;left:80px;top:125px;width:800px;height:320px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:26px 25px}
.l-toc .it{width:242px;text-align:center}
.l-toc .it p{font-size:var(--fs-sm)}

/* 03 whoa (big word + line) */
.l-whoa .big{position:absolute;left:204px;top:150px;width:552px;height:146px;display:flex;align-items:flex-end;justify-content:center;text-align:center;
  font-family:var(--font-display);font-size:var(--fs-d2);font-weight:700;line-height:1;color:var(--cyan)}
.l-whoa .sub{position:absolute;left:224px;top:310px;width:512px;text-align:center;font-size:var(--fs-lead)}

/* 04 section (centered) + .alt (number left, text left-aligned) */

.l-section.alt .sec-num{left:186px;top:206px;height:89px;justify-content:flex-end;padding-right:20px}

/* 06 bullets */

/* 08 zigzag 2 / 3 / 4 items (staggered heading + text) */

.l-zig.n3 .it{width:228px} .l-zig.n3 .it:nth-of-type(1){left:98px;top:189px} .l-zig.n3 .it:nth-of-type(2){left:366px;top:293px} .l-zig.n3 .it:nth-of-type(3){left:633px;top:189px}
.l-zig.n4 .it{width:228px} .l-zig.n4 .it:nth-of-type(1){left:289px;top:170px} .l-zig.n4 .it:nth-of-type(2){left:598px;top:170px}
.l-zig.n4 .it:nth-of-type(3){left:134px;top:310px} .l-zig.n4 .it:nth-of-type(4){left:443px;top:310px}

/* 09 five items (3 + 2) */
.l-five .grid{position:absolute;left:100px;top:140px;width:760px;display:flex;flex-wrap:wrap;justify-content:center;gap:34px 36px}
.l-five .it{width:228px;text-align:center}

/* 10 statement */
.l-statement .big{position:absolute;left:151px;top:165px;width:658px;height:210px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--font-display);font-size:var(--fs-d3);font-weight:700;line-height:1.08;color:var(--cyan)}
/* 10b focus: eyebrow + the key idea + follow-up, one centred block (used with .accent) */
.l-statement .st{position:absolute;left:120px;top:96px;width:720px;height:348px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.l-statement .st .big{position:static;width:auto;height:auto;font-size:var(--fs-sec);line-height:1.1}
.l-statement .eyebrow{font-size:var(--fs-lead);font-weight:700}
.l-statement .rule{width:64px;height:5px;background:var(--cyan)}
.l-statement .sub{font-size:var(--fs-lead)}

/* Accent (pacing): a blue canvas marks the pause on the one idea the audience must remember.
   Motif parts drawn in blue turn navy so they stay visible; all text turns white. */
.slide.accent{background:var(--blue)}
.slide.accent .deco{--blue:var(--navy)}
.slide.accent .big,.slide.accent .qt,.slide.accent .by,.slide.accent b,.slide.accent .hl{color:var(--white)}

/* 11 quote */
.l-quote .qw{position:absolute;left:129px;top:92px;width:702px;height:356px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.l-quote .qt{font-size:var(--fs-stat);line-height:1.2;color:var(--white)}
.l-quote .by{font-family:var(--font-display);font-size:var(--fs-h3);font-weight:700;color:var(--cyan)}

/* 12 photo (full-bleed + caption band) */
.l-photo .bg{position:absolute;inset:0;z-index:0}
.l-photo .cap{position:absolute;left:183px;top:421px;width:594px;height:60px;display:flex;align-items:center;justify-content:center;text-align:center;
  background:var(--navy);font-family:var(--font-display);font-size:var(--fs-h4);font-weight:700;color:var(--cyan);padding:0 20px}

/* 13 photo + text */
.l-phototext .txt{position:absolute;left:100px;top:79px;width:400px;height:360px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:18px}
.l-phototext .txt .tt{font-family:var(--font-display);font-size:var(--fs-h2);font-weight:700;line-height:var(--lh-title);color:var(--cyan)}
.l-phototext .pic{position:absolute;left:521px;top:90px;width:340px;height:340px}

/* 14 big number */
.l-bignum .num{position:absolute;left:180px;top:150px;width:600px;height:150px;display:flex;align-items:flex-end;justify-content:center;
  font-size:var(--fs-d1);color:var(--cyan)}
.l-bignum .cap{position:absolute;left:255px;top:312px;width:450px;text-align:center;font-size:var(--fs-lead)}

/* 15 stats (3 values) */
.l-stats .it{position:absolute;width:411px;text-align:center}
.l-stats .it .v{font-family:var(--font-display);font-size:var(--fs-sec);font-weight:700;color:var(--cyan);line-height:1.05;margin-bottom:8px}
.l-stats .it:nth-of-type(1){left:63px;top:150px} .l-stats .it:nth-of-type(2){left:486px;top:150px} .l-stats .it:nth-of-type(3){left:275px;top:300px}

/* 16 donuts (3 percentages, middle one flipped) */
.l-donuts .col{position:absolute;top:135px;width:228px;height:320px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:6px}
.l-donuts .col:nth-of-type(1){left:99px} .l-donuts .col:nth-of-type(2){left:366px;justify-content:flex-end} .l-donuts .col:nth-of-type(3){left:633px}
.l-donuts .ring{width:96px;height:96px;margin:4px 0 8px}
.l-donuts .col:nth-of-type(2) .ring{margin:8px 0 0}
.l-donuts .col p{font-size:var(--fs-sm)}

/* 17 pie (donut chart + legend) */
.l-pie .chart{position:absolute;left:95px;top:130px;width:320px;height:300px}
.l-pie .legend{position:absolute;left:480px;top:135px;width:400px;display:flex;flex-direction:column;gap:22px}

.l-pie .row .h4{margin-bottom:2px}
.l-pie .foot{position:absolute;left:103px;top:448px;width:754px;text-align:center;font-size:var(--fs-xs);color:var(--grey)}

/* 18 computer mockup + text */
.l-computer .mon{position:absolute;left:88px;top:130px;width:420px}
.l-computer .mon .scr{height:246px;border:12px solid var(--cyan);background:var(--white)}

.l-computer .txt{position:absolute;left:552px;top:150px;width:300px;height:250px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}

/* 19 tablet mockup (landscape, centered) */
.l-tablet .sub{position:absolute;left:200px;top:120px;width:560px;text-align:center}

.l-tablet .tab::before,.l-tablet .tab::after{content:"";position:absolute;top:50%;width:4px;height:64px;margin-top:-32px;background:var(--white)}
.l-tablet .tab::before{left:14px} .l-tablet .tab::after{right:14px}

.l-phone .ph-frame::after{content:"";position:absolute;left:50%;bottom:13px;width:56px;height:7px;margin-left:-28px;background:var(--navy)}

/* 21 table / comparison */

  font-family:var(--font-display);font-size:var(--fs-h4);font-weight:700;color:var(--white);text-align:center;line-height:1.05}
.l-stairs .it{position:absolute;width:230px}
.l-stairs .it p{font-size:var(--fs-sm)}
.l-stairs .lv:nth-of-type(1){left:338px;top:368px} .l-stairs .lv:nth-of-type(2){left:494px;top:298px}
.l-stairs .lv:nth-of-type(3){left:338px;top:228px} .l-stairs .lv:nth-of-type(4){left:494px;top:158px}
.l-stairs .it:nth-of-type(1){left:90px;top:360px;text-align:right} .l-stairs .it:nth-of-type(2){left:640px;top:290px}
.l-stairs .it:nth-of-type(3){left:90px;top:220px;text-align:right} .l-stairs .it:nth-of-type(4){left:640px;top:150px}

/* 25 gantt roadmap */
.l-gantt .g{position:absolute;left:76px;top:140px;width:808px;display:grid;grid-template-columns:150px repeat(var(--m,6),1fr);column-gap:4px;row-gap:14px;align-items:center}
.l-gantt .mo{font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);text-align:center;padding-bottom:8px;border-bottom:2px solid var(--cyan)}
.l-gantt .ph-l{grid-column:1;font-family:var(--font-display);font-size:var(--fs-h4);font-weight:700;color:var(--cyan);line-height:1.1}
.l-gantt .bar{height:48px;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:var(--fs-sm);background:var(--blue);color:var(--white);white-space:nowrap;overflow:hidden}
.l-gantt .bar.cyan{background:var(--cyan);color:var(--navy)}

/* 26 team */
.l-team .grid{position:absolute;left:75px;top:120px;width:810px;height:330px;display:flex;align-items:center;justify-content:center;gap:var(--gap,26px)}
.l-team .grid.five{--w:150px;--d:124px;--gap:14px}
.l-team .m .h4{min-height:2.2em}              /* full Vietnamese names wrap to 2 lines; keeps roles aligned */
.l-team .m{width:var(--w,170px);text-align:center}
.l-team .m .face{width:var(--d,150px);height:var(--d,150px);margin:0 auto 14px;overflow:hidden}
.l-team .m p{font-size:var(--fs-sm)}

/* 27 thanks */
.l-thanks .ty{position:absolute;left:180px;top:80px;width:600px;height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.l-thanks .big{margin-bottom:12px;font-family:var(--font-display);font-size:var(--fs-d2);font-weight:700;color:var(--cyan);line-height:1}
.l-thanks .ask{font-size:var(--fs-lead);font-weight:700}
.l-thanks .icons{display:flex;justify-content:center;gap:16px;margin-top:14px}

/* 28 diagram (free canvas) */
.l-diagram .stage{position:absolute;left:var(--mx);top:125px;width:810px;height:320px;display:flex;align-items:center;justify-content:center}

/* ===================== DECK-SPECIFIC (keep tiny, tokens only) ===================== */

/* ===================== Presentation shell (not part of the look) ===================== */
.hud{position:fixed;right:14px;bottom:12px;font:700 12px/1 var(--font-body);color:rgba(255,255,255,.55);letter-spacing:.04em;user-select:none;z-index:9}
body.overview{overflow:auto}
body.overview .deck{position:static;transform:none!important;width:auto;height:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:18px}
body.overview .slide{position:relative;display:block;zoom:.32;cursor:pointer;outline:2px solid rgba(255,255,255,.14)}
body.overview .slide.active{outline:10px solid var(--cyan)}
@media print{
  @page{size:960px 540px;margin:0}
  html,body{overflow:visible;height:auto}
  .deck{position:static;transform:none!important;width:auto;height:auto}
  .slide{position:relative;display:block!important;break-after:page;page-break-after:always}
  .hud{display:none}
}
</style>

<div class="hud" id="hud"></div>
<script>
/* Deck runtime: fit-to-window, ← → / Space / PgUp PgDn / Home End, F = fullscreen, O = overview, #n deep link, P = print */
(function(){
  const deck=document.querySelector('.deck'), slides=[...deck.querySelectorAll('.slide')], hud=document.getElementById('hud');
  let i=0; try{i=Math.min(Math.max((parseInt(location.hash.slice(1))||1)-1,0),slides.length-1)}catch(e){}
  function fit(){ if(document.body.classList.contains('overview'))return;
    const s=Math.min(innerWidth/960,innerHeight/540); deck.style.transform=`translate(${(innerWidth-960*s)/2}px,${(innerHeight-540*s)/2}px) scale(${s})`; }
  function show(n){ i=Math.min(Math.max(n,0),slides.length-1); slides.forEach((s,k)=>s.classList.toggle('active',k===i));
    hud.textContent=(i+1)+' / '+slides.length; try{history.replaceState(null,'','#'+(i+1))}catch(e){} }
  addEventListener('keydown',e=>{
    if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(i+1)}
    else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(i-1)}
    else if(e.key==='Home')show(0); else if(e.key==='End')show(slides.length-1);
    else if(e.key==='f'||e.key==='F'){try{const r=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();r&&r.catch&&r.catch(()=>{})}catch(e){}}
    else if(e.key==='o'||e.key==='O'){document.body.classList.toggle('overview');fit();slides[i].scrollIntoView({block:'center'})}
    else if(e.key==='p'||e.key==='P'){print()}
  });
  slides.forEach((s,k)=>s.addEventListener('click',()=>{ if(document.body.classList.contains('overview')){document.body.classList.remove('overview');show(k);fit()} }));
  addEventListener('resize',fit); fit(); show(i);
})();
</script>
