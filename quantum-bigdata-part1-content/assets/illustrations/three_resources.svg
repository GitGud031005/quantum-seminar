<svg xmlns="http://www.w3.org/2000/svg" width="790" height="255" viewBox="0 0 790 255" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="790" height="255" fill="#ffffff"/><rect x="20.0" y="30.0" width="226.0" height="110.0" rx="14" fill="#ffffff" stroke="#111111" stroke-width="3"/><text x="133.0" y="78.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#111111" font-weight="bold">Superposition</text><text x="133.0" y="108.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#777777" font-weight="normal">opens up 2ⁿ possibilities</text><line x1="250.0" y1="85.0" x2="267.0" y2="85.0" stroke="#111111" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 278.0 85.0 L 267.0 79.0 L 267.0 91.0 Z" fill="#111111"/><rect x="282.0" y="30.0" width="226.0" height="110.0" rx="14" fill="#ffffff" stroke="#111111" stroke-width="3"/><text x="395.0" y="78.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#111111" font-weight="bold">Entanglement</text><text x="395.0" y="108.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#777777" font-weight="normal">links qubits together</text><line x1="512.0" y1="85.0" x2="529.0" y2="85.0" stroke="#111111" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 540.0 85.0 L 529.0 79.0 L 529.0 91.0 Z" fill="#111111"/><rect x="544.0" y="30.0" width="226.0" height="110.0" rx="14" fill="#ffffff" stroke="#111111" stroke-width="3"/><text x="657.0" y="78.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#111111" font-weight="bold">Interference</text><text x="657.0" y="108.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#777777" font-weight="normal">pushes toward the answer</text><rect x="20.0" y="170.0" width="750.0" height="70.0" rx="14" fill="#ffffff" stroke="#111111" stroke-width="2.5" stroke-dasharray="8 6"/><text x="40.0" y="200.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#111111" font-weight="bold">Two rules:</text><text x="160.0" y="200.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" fill="#111111" font-weight="normal">reading gives one bit per qubit</text><text x="160.0" y="226.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" fill="#111111" font-weight="normal">qubits cannot be copied</text></svg>