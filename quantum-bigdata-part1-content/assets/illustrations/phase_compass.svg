<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="290" fill="#ffffff"/><circle cx="160.0" cy="150.0" r="100.0" fill="none" stroke="#111111" stroke-width="3"/><circle cx="160.0" cy="150.0" r="5.0" fill="#111111" stroke="#111111" stroke-width="0"/><text x="160.0" y="284.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#777777" font-weight="normal">The equator seen from above</text><line x1="160.0" y1="150.0" x2="245.0" y2="150.0" stroke="#111111" stroke-width="5" stroke-linecap="round" opacity="1"/><path d="M 256.0 150.0 L 245.0 143.9 L 245.0 156.1 Z" fill="#111111"/><text x="274.0" y="157.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#111111" font-weight="bold">E</text><line x1="160.0" y1="150.0" x2="75.0" y2="150.0" stroke="#777777" stroke-width="5" stroke-linecap="round" opacity="1"/><path d="M 64.0 150.0 L 75.0 156.1 L 75.0 143.9 Z" fill="#777777"/><text x="46.0" y="157.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" text-anchor="end" fill="#111111" font-weight="bold">W</text><text x="210.0" y="136.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#111111" font-weight="normal">plus</text><text x="110.0" y="136.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#777777" font-weight="normal">minus</text><rect x="330.0" y="40.0" width="440.0" height="95.0" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2.5"/><text x="350.0" y="72.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" fill="#111111" font-weight="bold">Ask “0 or 1?”</text><text x="350.0" y="104.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#111111" font-weight="normal">plus → 50/50   ·   minus → 50/50</text><text x="350.0" y="126.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" fill="#777777" font-weight="normal">They look identical.</text><rect x="330.0" y="160.0" width="440.0" height="95.0" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2.5"/><text x="350.0" y="192.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" fill="#111111" font-weight="bold">Ask “east or west?”</text><text x="350.0" y="224.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#111111" font-weight="normal">plus → always E   ·   minus → always W</text><text x="350.0" y="246.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" fill="#777777" font-weight="normal">The phase is real information.</text></svg>